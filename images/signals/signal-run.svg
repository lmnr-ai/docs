<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 213" width="688" height="213" role="img" aria-label="How a Signal run works: the trace is compressed into a transcript, an agent searches it and fetches full spans before submitting findings, and each finding becomes a signal event that feeds alerts, clusters, and SQL."><title>How a Signal run works: the trace is compressed into a transcript, an agent searches it and fetches full spans before submitting findings, and each finding becomes a signal event that feeds alerts, clusters, and SQL.</title><style>@font-face{font-family:"Figure Sans";font-weight:460;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Figure Sans";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}svg{--figure-font:"Figure Sans",ui-sans-serif,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}@media (prefers-reduced-motion:reduce){.flow{display:none}}</style><g><path d="M 176 87.5 L 208 87.5" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 203 91.5 L 208 87.5 L 203 83.5" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M 376 87.5 L 408 87.5" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 403 91.5 L 408 87.5 L 403 83.5" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M 564 87.5 C 571.48 87.5 576.54 28 586 28 L 596 28" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 591 32 L 596 28 L 591 24" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M 564 87.5 C 571.48 87.5 576.54 88 586 88 L 596 88" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 591 92 L 596 88 L 591 84" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M 564 87.5 C 571.48 87.5 576.54 148 586 148 L 596 148" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 591 152 L 596 148 L 591 144" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><rect x="0" y="0" width="176" height="175" rx="6" fill="#212121"/><text x="16.00" y="28.00" fill="#ffffff" style="font-family:var(--figure-font);font-weight:500;font-size:16px;letter-spacing:0.2px;white-space:pre">Transcript</text><text x="16.00" y="60.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">user request</text><text x="16.00" y="92.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">system prompt</text><text x="129.00" y="91.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">once</text><text x="16.00" y="124.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">LLM turns</text><text x="16.00" y="156.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">tool calls</text><rect x="208" y="0" width="168" height="175" rx="6" fill="#212121"/><text x="224.00" y="28.00" fill="#ffffff" style="font-family:var(--figure-font);font-weight:500;font-size:16px;letter-spacing:0.2px;white-space:pre">Signal agent</text><text x="224.00" y="60.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">search spans</text><text x="224.00" y="92.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">fetch full span</text><text x="224.00" y="123.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">repeat as needed</text><text x="224.00" y="156.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">submit findings</text><rect x="408" y="0" width="156" height="175" rx="6" fill="#212121"/><rect x="424" y="19" width="7" height="7" rx="4" fill="#c66945"/><text x="441.00" y="28.00" fill="#ffffff" style="font-family:var(--figure-font);font-weight:500;font-size:16px;letter-spacing:0.2px;white-space:pre">signal_events</text><rect x="416" y="42" width="140" height="24" rx="4" fill="#2c2c2c"/><text x="424.00" y="59.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">id</text><text x="484.00" y="59.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">severity</text><text x="424.00" y="92.00" fill="#c66945" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">ev_91</text><text x="484.00" y="92.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">critical</text><text x="424.00" y="124.00" fill="#c66945" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">ev_92</text><text x="484.00" y="124.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">warning</text><text x="424.00" y="156.00" fill="#c66945" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">ev_93</text><text x="484.00" y="156.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">info</text><rect x="596" y="6" width="92" height="44" rx="6" fill="#212121"/><text x="612.00" y="33.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">Alerts</text><rect x="596" y="66" width="92" height="44" rx="6" fill="#212121"/><text x="612.00" y="93.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">Clusters</text><rect x="596" y="126" width="92" height="44" rx="6" fill="#212121"/><text x="612.00" y="153.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">SQL</text><text x="0.00" y="208.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">1.</text><text x="18.00" y="208.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">Compress the trace</text><text x="208.00" y="208.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">2.</text><text x="229.00" y="208.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">Agent investigates</text><text x="408.00" y="208.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">3.</text><text x="429.00" y="208.00" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">Findings become events</text></svg>
