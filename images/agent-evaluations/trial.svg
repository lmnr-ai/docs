<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 351" width="688" height="351" role="img" aria-label="One agent evaluation trial. The task folder's environment files are copied into a fresh container built from your image, the driver calls your app, and the app writes a result and its trajectory to /logs/agent. The task's tests folder arrives only when the verifier runs; the verifier reads the result and writes a reward. Laminar records the trajectory as the trial's trace and the reward as its score."><title>One agent evaluation trial. The task folder's environment files are copied into a fresh container built from your image, the driver calls your app, and the app writes a result and its trajectory to /logs/agent. The task's tests folder arrives only when the verifier runs; the verifier reads the result and writes a reward. Laminar records the trajectory as the trial's trace and the reward as its score.</title><style>@font-face{font-family:"Figure Sans";font-weight:460;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Figure Sans";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}svg{--figure-font:"Figure Sans",ui-sans-serif,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}@media (prefers-reduced-motion:reduce){.flow{display:none}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse" x="0" y="0"><circle cx="8" cy="8" r="0.9" fill="#303030"></circle></pattern></defs><rect x="0" y="0" width="688" height="323" fill="url(#dots)"></rect><path d="M 136 80 L 176 80" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 136 112 L 176 112" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 136 240 L 176 240" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 536 208 L 5