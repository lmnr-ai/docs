<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 255" width="688" height="255" role="img" aria-label="Where the verifier runs. With environment_mode shared, /tests/test.sh runs in the agent's container and can read the database and /logs/agent directly. With separate, it runs in a fresh container that only receives the files listed in artifacts and the snapshots taken by verifier.collect commands."><title>Where the verifier runs. With environment_mode shared, /tests/test.sh runs in the agent's container and can read the database and /logs/agent directly. With separate, it runs in a fresh container that only receives the files listed in artifacts and the snapshots taken by verifier.collect commands.</title><style>@font-face{font-family:"Figure Sans";font-weight:460;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Figure Sans";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}svg{--figure-font:"Figure Sans",ui-sans-serif,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}@media (prefers-reduced-motion:reduce){.flow{display:none}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse" x="0" y="0"><circle cx="8" cy="8" r="0.9" fill="#303030"></circle></pattern></defs><rect x="0" y="0" width="688" height="227" fill="url(#dots)"></rect><rect x="0" y="26" width="289.8125" height="175" rx="6" fill="#212121"/><text x="16.00" y="54.00" fill="#ffffff" style="font-family:var(--figure-font);font-weight:500;font-size:16px;letter-spacing:0.2px;white-space:pre">Agent container</text><text x="16.00" y="85.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">app + services</text><text x="16.00" y="117.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">database</text><text x="16.00" y="149.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">/logs/agent/result.json</text><text x="16.00" y="181.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">/tests/test.sh</text><text x="231.58" y="180.50" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">shared</text><rect x="393.8125" y="26" width="294.1875" height="175" rx="6" fill="#212121"/><text x="409.81" y="54.00" fill="#ffffff" style="font-family:var(--figure-font);font-weight:500;font-size:16px;letter-spacing:0.2px;white-space:pre">Verifier container</text><text x="409.81" y="85.50" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">fresh environment</text><text x="409.81" y="117.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">db snapshot</text><text x="409.81" y="149.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">result.json</text><text x="409.81" y="181.50" fill="#b8b8b8" style="font-family:var(--figure-font);font-weight:460;font-size:15px;letter-spacing:0.2px;white-space:pre">/tests/test.sh</text><text x="617.53" y="180.50" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">separate</text><text x="321.02" y="103.86" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">collect</text><text x="315.45" y="135.86" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:13px;letter-spacing:0.2px;white-space:pre">artifacts</text><text x="12.00" y="245.00" fill="#777777" style="font-family:var(--figure-font);font-weight:460;font-size:12px;